name: Quant Screener

on:
  schedule:
    # KST = UTC+9. 아래 세 시각 모두 KST 기준 09시 이후라 UTC 요일이 같다.
    - cron: "30 23 * * 0-4"  # 08:30 KST 월~금 — 장 시작 전, 전날 완성봉 기준
    - cron: "40 6 * * 1-5"   # 15:40 KST 월~금 — 정규장 마감 직후
    - cron: "0 11 * * 1-5"   # 20:00 KST 월~금 — 데이터 확정 + 저녁 DART 공시
  workflow_dispatch:           # 수동 실행

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 백테스트가 유니버스 표본 전체를 스캔함
    defaults:
      run:
        working-directory: screener

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python main.py
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
